<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Glow -->
  <path d="M50 8 L85 22 V50 C85 72 69 88 50 94 C31 88 15 72 15 50 V22 Z" 
        stroke="url(#shieldGrad)" stroke-width="2.5" fill="#0B132B" fill-opacity="0.9" filter="url(#glow)"/>

  <!-- Inner Circuit Patterns -->
  <path d="M50 18 L75 28 V48 C75 64 63 77 50 82 C37 77 25 64 25 48 V28 Z" 
        stroke="#1E293B" stroke-width="1.5" fill="#070D1F"/>

  <!-- Lock Body -->
  <rect x="36" y="44" width="28" height="22" rx="4" fill="url(#shieldGrad)" />
  
  <!-- Lock Shackle -->
  <path d="M42 44 V36 C42 31.5 45.5 28 50 28 C54.5 28 58 31.5 58 36 V44" 
        stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Keyhole -->
  <circle cx="50" cy="53" r="3" fill="#070D1F"/>
  <path d="M48.5 53 L47.5 61 H52.5 L51.5 53 Z" fill="#070D1F"/>
  
  <!-- Accent Pulse Dot -->
  <circle cx="50" cy="88" r="2.5" fill="#38EF7D" filter="url(#glow)"/>
</svg>
